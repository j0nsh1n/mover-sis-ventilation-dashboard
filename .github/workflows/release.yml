name: Release

# Builds the Linux executable and publishes a GitHub Release when:
#   - a version tag is pushed (v0.1.0), or
#   - main is pushed and the VERSION tag does not exist yet, or
#   - workflow_dispatch (manual)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild and re-upload assets even if the release exists"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries for PySide6 / PyInstaller
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libfontconfig1 libfreetype6 libx11-6 libxext6 \
            libxrender1 binutils

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version
        id: ver
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release for v$VERSION"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pyinstaller>=6.3' pytest

      - name: Run non-GUI tests
        run: PYTHONPATH=. QT_QPA_PLATFORM=offscreen pytest -q --ignore=tests/test_desktop_app.py --ignore=tests/test_desktop_paths_ui.py
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build executable
        run: |
          chmod +x scripts/build_executable.sh
          ./scripts/build_executable.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MOVER-SIS-Monitor-v${{ steps.ver.outputs.version }}-linux-x86_64
          path: |
            dist/MOVER-SIS-Monitor-v${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz
            dist/MOVER-SIS-Monitor-linux-x86_64.tar.gz
          if-no-files-found: error

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MOVER SIS Monitor ${{ steps.ver.outputs.tag }}
          body: |
            ## MOVER SIS Monitor ${{ steps.ver.outputs.tag }}

            Linux x86_64 desktop build (Nobara / Fedora / Ubuntu-compatible).

            ### Install
            1. Download `MOVER-SIS-Monitor-v${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz`
            2. Extract and run:
            ```bash
            tar -xzf MOVER-SIS-Monitor-v${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz
            cd MOVER-SIS-Monitor
            ./launch.sh
            ```
            3. In the app, **Browse…** to your SIS EMR folder (`patient_information.csv`).

            ### Notes
            - Research / education use only — not for clinical care
            - Prefer X11/XWayland (`QT_QPA_PLATFORM=xcb`) on KDE Wayland if needed
          files: |
            dist/MOVER-SIS-Monitor-v${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz
            dist/MOVER-SIS-Monitor-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
