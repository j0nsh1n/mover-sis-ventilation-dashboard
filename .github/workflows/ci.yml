name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pinned to Python 3.14 per agents.md / spec.md language baseline
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries for PySide6 / Qt offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libfontconfig1 \
            libfreetype6 \
            libx11-6 \
            libxext6 \
            libxrender1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install ruff==0.16.9 mypy==2.3.1 types-PyYAML

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy

      - name: Validate thresholds config
        run: PYTHONPATH=. python -c "from src.config import load_thresholds; load_thresholds('default'); load_thresholds('strict'); load_thresholds('lenient'); print('thresholds OK')"

      - name: Run tests
        run: PYTHONPATH=. pytest --cov=src --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "0"

      - name: Run Rust updater tests
        working-directory: rust-updater-tests
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
        env:
          PYTHONPATH: ..
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "0"

      - name: Verify Rust release signer
        working-directory: tools/update-manifest
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Import dashboard + desktop modules
        run: |
          PYTHONPATH=. python -c "from src.dashboard.components import case_timeline_figure; from src.pipeline.run import run_pipeline; print('pipeline OK')"
          PYTHONPATH=. python -c "from src.desktop.charts import score_histogram_figure; from src.desktop.app import MainWindow; print('desktop OK')"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Packaging structure checks
        run: PYTHONPATH=. pytest tests/test_packaging.py -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build and smoke test frozen Linux app
        env:
          MOVER_CONFIG_DIR: ${{ runner.temp }}/mover-smoke/config
          OLLAMA_MODELS: ${{ runner.temp }}/mover-smoke/models
          MOVER_EMR_DIR: ${{ runner.temp }}/mover-smoke/EMR
          MOVER_PROCESSED_DIR: ${{ runner.temp }}/mover-smoke/processed
          MOVER_UPDATE_MANIFEST_URL: ""
          MOVER_SKIP_SETUP: "1"
        run: |
          ./scripts/build_executable.sh
          dist/MOVER-SIS-Monitor/MOVER-SIS-Monitor --selftest-scan

  test-windows:
    # Same suite the release's Windows job runs, so a Windows-only failure shows up on the PR.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests (as the release's Windows job does)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: pytest -q --ignore=tests/test_desktop_app.py --ignore=tests/test_desktop_paths_ui.py

  windows-layout-probe:
    # TEMPORARY (2026-11-15): a fast run of the four Windows-only layout failures with their measurements.
    # Remove this job and tests/windows_layout_probe.py once they pass on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Measurements
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: pytest -q -s -p no:cacheprovider tests/windows_layout_probe.py

      - name: Pictures for the owner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-layout-pictures
          path: probe-shots/
          if-no-files-found: warn

      - name: The four layout tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: >-
          pytest -q -p no:cacheprovider
          "tests/test_cases_page.py::test_the_table_never_scrolls_sideways_and_shows_all_nine_columns_at_every_width"
          "tests/test_cases_page.py::test_below_the_least_width_the_page_scrolls_and_the_list_does_not"
          "tests/test_cases_page.py::test_the_scan_scope_lists_only_the_moved_fields_its_cases_have"
          "tests/test_handoff_panel.py::test_the_box_fits_its_lines_at_other_text_sizes"
          "tests/test_handoff_panel.py::test_the_table_needs_no_sideways_scroll_where_the_page_is_wide_enough_for_it"
          "tests/test_marks.py::test_the_text_of_a_missing_cell_has_a_clear_backing_so_the_hatch_never_crosses_the_letters"

  updater-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install desktop build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==6.22.3"

      - name: Exercise updater install and rollback
        working-directory: rust-updater-tests
        run: cargo test --test windows_apply --locked

      - name: Build frozen Windows app
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/mover_sis_monitor.spec

      - name: Smoke test frozen Windows app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:MOVER_SKIP_SETUP = "1"
          $app = "dist/MOVER-SIS-Monitor/MOVER-SIS-Monitor.exe"
          if (-not (Test-Path $app)) { throw "expected $app" }
          $process = Start-Process -FilePath $app -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 15
          if ($process.HasExited) { throw "frozen app exited early with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          $scan = Start-Process -FilePath $app -ArgumentList "--selftest-scan" -PassThru -Wait -WindowStyle Hidden
          if ($scan.ExitCode -ne 0) { throw "selftest-scan failed with code $($scan.ExitCode)" }
