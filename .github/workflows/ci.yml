name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries for PySide6 / Qt offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libfontconfig1 \
            libfreetype6 \
            libx11-6 \
            libxext6 \
            libxrender1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Validate thresholds config
        run: PYTHONPATH=. python -c "from src.config import load_thresholds; load_thresholds('default'); load_thresholds('strict'); load_thresholds('lenient'); print('thresholds OK')"

      - name: Run tests
        run: PYTHONPATH=. pytest --cov=src --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "0"

      - name: Import dashboard + desktop modules
        run: |
          PYTHONPATH=. python -c "from src.dashboard.components import case_timeline_figure; from src.pipeline.run import run_pipeline; print('pipeline OK')"
          PYTHONPATH=. python -c "from src.desktop.charts import top_cases_figure; from src.desktop.app import MainWindow; print('desktop OK')"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Packaging structure checks
        run: PYTHONPATH=. pytest tests/test_packaging.py -q
        env:
          QT_QPA_PLATFORM: offscreen
