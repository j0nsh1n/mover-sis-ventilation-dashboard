name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Pinned to Python 3.14 per agents.md / spec.md language baseline
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries for PySide6 / Qt offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libfontconfig1 \
            libfreetype6 \
            libx11-6 \
            libxext6 \
            libxrender1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pip install ruff==0.16.9 mypy==2.3.1 types-PyYAML

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy

      - name: Validate thresholds config
        run: PYTHONPATH=. python -c "from src.config import load_thresholds; load_thresholds('default'); load_thresholds('strict'); load_thresholds('lenient'); print('thresholds OK')"

      - name: Run tests
        run: PYTHONPATH=. pytest --cov=src --cov-report=term-missing
        env:
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "0"

      - name: Run Rust updater tests
        working-directory: rust-updater-tests
        run: |
          rustup component add rustfmt clippy
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
        env:
          PYTHONPATH: ..
          QT_QPA_PLATFORM: offscreen
          QT_DEBUG_PLUGINS: "0"

      - name: Verify Rust release signer
        working-directory: tools/update-manifest
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Import dashboard + desktop modules
        run: |
          PYTHONPATH=. python -c "from src.dashboard.components import case_timeline_figure; from src.pipeline.run import run_pipeline; print('pipeline OK')"
          PYTHONPATH=. python -c "from src.desktop.charts import top_cases_figure; from src.desktop.app import MainWindow; print('desktop OK')"
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Packaging structure checks
        run: PYTHONPATH=. pytest tests/test_packaging.py -q
        env:
          QT_QPA_PLATFORM: offscreen

  updater-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install desktop build dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.3"

      - name: Exercise updater install and rollback
        working-directory: rust-updater-tests
        run: cargo test --test windows_apply --locked

      - name: Build frozen Windows app
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/mover_sis_monitor.spec

      - name: Smoke test frozen Windows app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:MOVER_SKIP_SETUP = "1"
          $app = "dist/MOVER-SIS-Monitor/MOVER-SIS-Monitor.exe"
          if (-not (Test-Path $app)) { throw "expected $app" }
          $process = Start-Process -FilePath $app -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 15
          if ($process.HasExited) { throw "frozen app exited early with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
