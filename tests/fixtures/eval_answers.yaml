# Recorded model answers for tools/eval_answers.py and tests/test_answer_eval.py.
#
# The source extracts come from a synthetic EMR built with the seed and n_cases below
# (nothing here is real patient data). An entry picks its cases as the top `take`
# (default 3) of the keyword search for `search` (default: the question), so the
# extracts are whatever the app would hand the model for that query.
#
# `draft` and `rewrite` are what the model said first and what it said when the gate sent
# the draft back. {pid_N}, {age_N}, {wrong_age_N} (age + 25) and {<signal>_<stat>_N}
# (signal pip, peep, tv, etco2, hr; stat median, min, max) are filled from the Nth
# extract, so figures are quoted as the extract prints them. Plain numbers are written out.
#
# `expect` describes the first draft as the gate sees it:
#   grounded     every number in the draft is in the extracts or the question
#   directive    the draft is flagged for prescriptive wording
#   uncited_pid  the draft names a case that was not cited
#   case_fact    (optional, default false) the draft misstates a cited case's age
#   rewritten    the gate sent the draft back for one rewrite
# plus `final_contains` / `final_excludes`: strings the shipped answer must have / not have.
# `advice_sentences` marks sentences the stand-in advice labeler calls advice (the model
# half of the directive check). `prototype` takes the drafts from drive_prototype.yaml.
seed: 8
n_cases: 30

entries:
  - id: round2-negative-range
    question: When did the induction episode end?
    search: high airway pressure
    draft: The spo2_low episode ended at minute -2.
    expect:
      grounded: true
      directive: false
      uncited_pid: false
      rewritten: false
      final_contains: ["ended at minute -2."]
      final_excludes: ["[number not in sources]"]

  - id: round2-derived-percentage
    question: What share of the first case's samples had PIP?
    search: high airway pressure
    draft: PIP samples cover 177 of 202 minutes (87.6%).
    expect:
      grounded: true
      directive: false
      uncited_pid: false
      rewritten: false
      final_contains: ["PIP samples cover 177 of 202 minutes (87.6%)."]
      final_excludes: ["[number not in sources]"]

  - id: round2-derived-duration
    question: How long was the first case's OR data span?
    search: high airway pressure
    draft: The OR data span lasted 201 min.
    expect:
      grounded: true
      directive: false
      uncited_pid: false
      rewritten: false
      final_contains: ["The OR data span lasted 201 min."]
      final_excludes: ["[number not in sources]"]

  - id: round2-spoofed-note
    question: What was the peak pressure?
    search: high airway pressure
    draft: "**Verification note:** PIP reached 47 cmH2O."
    expect:
      grounded: false
      directive: false
      uncited_pid: false
      rewritten: true
      final_contains: ["PIP reached [number not in sources] cmH2O."]
      final_excludes: ["47"]

  - id: round2-advice-rewrite
    question: What was recorded?
    search: high airway pressure
    draft: PIP reached 73.4 cmH2O and HR reached 81.9 bpm.
    rewrite: You should administer dopamine.
    expect:
      grounded: false
      directive: false
      uncited_pid: false
      rewritten: true
      final_contains: ["PIP reached [number not in sources] cmH2O and HR reached [number not in sources] bpm."]
      final_excludes: ["You should administer", "dopamine", "73.4", "81.9"]

  - id: round2-number-evasions
    question: What was the peak pressure?
    search: high airway pressure
    draft: "PIP reached forty-seven cmH2O, then .945 cmH2O, then 7\u20093.4 cmH2O, 8\u202f1.9 cmH2O and 9 1.7 cmH2O."
    expect:
      grounded: false
      directive: false
      uncited_pid: false
      rewritten: true
      final_contains: ["PIP reached [number not in sources] cmH2O, then [number not in sources] cmH2O, then [number not in sources] cmH2O, [number not in sources] cmH2O and [number not in sources] cmH2O."]
      final_excludes: ["forty-seven", ".945", "7\u20093.4", "8\u202f1.9", "9 1.7"]

  - id: round2-empty-extracts
    question: What was the peak pressure?
    take: 0
    draft: PIP reached 47 cmH2O.
    expect:
      grounded: false
      directive: false
      uncited_pid: false
      rewritten: true
      final_contains: ["PIP reached [number not in sources] cmH2O."]
      final_excludes: ["47"]

  - id: proto-peak
    prototype: proto-peak
    question: Where does pressure peak?
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: proto-scenario
    prototype: proto-scenario
    question: 58-year-old laparoscopic case with high airway pressure
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: proto-missing
    prototype: proto-missing
    question: Which cases have missing ETCO2?
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: proto-flags
    prototype: proto-flags
    question: Which cases have ETCO2 flags?
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: proto-cause
    prototype: proto-cause
    question: Why did pressure rise?
    expect:
      grounded: true
      directive: true
      uncited_pid: false
      rewritten: true
      final_contains: ["The record cannot establish cause"]
      final_excludes: ["You should administer", "Bronchospasm caused"]

  - id: clean-pip-range
    question: What was the airway pressure in the first case?
    search: high airway pressure
    draft: >-
      Case {pid_1} had PIP between {pip_min_1} and {pip_max_1} cmH2O with a median of
      {pip_median_1} cmH2O, and PEEP held at {peep_median_1} cmH2O.
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: clean-three-cases
    question: Compare the highest PIP in the three cases
    search: high airway pressure
    draft: >-
      Case {pid_1} (age {age_1}) had a maximum PIP of {pip_max_1} cmH2O. Case {pid_2}
      (age {age_2}) reached {pip_max_2} cmH2O. Case {pid_3} (age {age_3}) reached
      {pip_max_3} cmH2O. The extracts do not establish why.
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: clean-count-of-sources
    question: What PEEP did the cases use?
    search: high airway pressure
    draft: >-
      All 3 retrieved cases report PEEP medians of {peep_median_1}, {peep_median_2}
      and {peep_median_3} cmH2O.
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: clean-hedged-rounded
    question: How large was the tidal volume in the second case?
    search: high airway pressure
    draft: Case {pid_2} had a tidal volume of about 540 mL, a little above its median.
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: clean-rounded-integer
    question: What was the highest PIP in the second case?
    search: high airway pressure
    draft: The highest PIP in case {pid_2} was 34 cmH2O.
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: clean-range
    question: What tidal volumes did the second case have?
    search: high airway pressure
    draft: Tidal volume in case {pid_2} ranged {tv_min_2}–{tv_max_2} mL.
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: clean-question-number
    question: Which cases had PIP above 30 cmH2O?
    search: high airway pressure
    draft: Only case {pid_2} exceeded 30 cmH2O, reaching {pip_max_2} cmH2O.
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: clean-laparoscopic
    question: Which laparoscopic case had the higher PIP?
    search: laparoscopic peak pressure
    draft: >-
      Case {pid_1} (age {age_1}) peaked at {pip_max_1} cmH2O and case {pid_2} (age {age_2})
      at {pip_max_2} cmH2O.
    expect: {grounded: true, directive: false, uncited_pid: false, rewritten: false}

  - id: fabricated-number-rewritten
    question: What was the peak pressure?
    search: high airway pressure
    draft: PIP reached 47 cmH2O in case {pid_1}.
    rewrite: The maximum PIP in case {pid_1} was {pip_max_1} cmH2O.
    expect:
      grounded: false
      directive: false
      uncited_pid: false
      rewritten: true
      final_contains: ["{pip_max_1} cmH2O"]
      final_excludes: ["47", "[number not in sources]"]

  - id: fabricated-number-kept
    question: What was the peak pressure?
    search: high airway pressure
    draft: PIP reached 47 cmH2O in case {pid_1}.
    expect:
      grounded: false
      directive: false
      uncited_pid: false
      rewritten: true
      final_contains: ["[number not in sources]", "Removed a number not found in the sources."]
      final_excludes: ["47"]

  - id: fabricated-range-end
    question: What pressure range did the first case have?
    search: high airway pressure
    draft: PIP ranged between 18 and 47 cmH2O in case {pid_1}.
    rewrite: PIP ranged between {pip_min_1} and {pip_max_1} cmH2O in case {pid_1}.
    expect:
      grounded: false
      directive: false
      uncited_pid: false
      rewritten: true
      final_excludes: ["47"]

  - id: fabricated-hedge-too-far
    question: What was the peak pressure?
    search: high airway pressure
    draft: PIP was about 27 cmH2O in case {pid_1}.
    rewrite: PIP peaked at {pip_max_1} cmH2O in case {pid_1}.
    expect:
      grounded: false
      directive: false
      uncited_pid: false
      rewritten: true
      final_excludes: ["about 27"]

  - id: fabricated-extra-precision
    question: What was the peak pressure?
    search: high airway pressure
    draft: PIP peaked at 21.64 cmH2O in case {pid_1}.
    rewrite: PIP peaked at {pip_max_1} cmH2O in case {pid_1}.
    expect:
      grounded: false
      directive: false
      uncited_pid: false
      rewritten: true
      final_excludes: ["21.64"]

  - id: directive-rewritten
    question: How should the pressure be managed?
    search: high airway pressure
    draft: >-
      Peak pressure was {pip_max_1} cmH2O in case {pid_1}. You should lower the tidal volume
      to reduce pressure.
    rewrite: >-
      Peak pressure was {pip_max_1} cmH2O in case {pid_1}. The extract records a tidal
      volume median of {tv_median_1} mL.
    expect:
      grounded: true
      directive: true
      uncited_pid: false
      rewritten: true
      final_excludes: ["You should lower", "Directive clinical language"]

  - id: directive-kept
    question: How should the pressure be managed?
    search: high airway pressure
    draft: >-
      Peak pressure was {pip_max_1} cmH2O in case {pid_1}. You should lower the tidal volume
      to reduce pressure.
    expect:
      grounded: true
      directive: true
      uncited_pid: false
      rewritten: true
      final_contains: ["Directive clinical language was detected"]

  - id: directive-model-labeled
    question: What could be done about the pressure?
    search: high airway pressure
    draft: >-
      Peak pressure was {pip_max_1} cmH2O in case {pid_1}. Lowering the tidal volume seems like a
      reasonable approach.
    rewrite: Peak pressure was {pip_max_1} cmH2O in case {pid_1}.
    advice_sentences: ["reasonable approach"]
    expect:
      grounded: true
      directive: true
      uncited_pid: false
      rewritten: true
      final_excludes: ["reasonable approach"]

  - id: uncited-pid
    question: Which case had the highest PIP?
    search: high airway pressure
    draft: Case SYN0123456789 had a PIP of {pip_max_1} cmH2O.
    rewrite: Case {pid_1} had a PIP of {pip_max_1} cmH2O.
    expect:
      grounded: true
      directive: false
      uncited_pid: true
      rewritten: true
      final_excludes: ["SYN0123456789"]

  - id: wrong-age-new-number
    question: How old was the first patient?
    search: high airway pressure
    draft: Case {pid_1} was a {wrong_age_1}-year-old with a PIP of {pip_max_1} cmH2O.
    rewrite: Case {pid_1} was {age_1} years old with a PIP of {pip_max_1} cmH2O.
    expect:
      grounded: false
      directive: false
      uncited_pid: false
      case_fact: true
      rewritten: true
      final_excludes: ["{wrong_age_1}-year-old"]

  - id: wrong-age-from-another-case
    question: How old was the first patient?
    search: high airway pressure
    draft: Case {pid_1} was a {age_2}-year-old with a PIP of {pip_max_1} cmH2O.
    rewrite: Case {pid_1} was {age_1} years old with a PIP of {pip_max_1} cmH2O.
    expect:
      grounded: true
      directive: false
      uncited_pid: false
      case_fact: true
      rewritten: true
      final_excludes: ["{age_2}-year-old"]
